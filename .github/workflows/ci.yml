name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v -n 2

    - name: Build Docker image
      run: |
        docker build -t pharmaassist:latest .

    - name: Verify Docker image starts
      run: |
        docker run --rm -e GEMINI_API_KEY=test-key pharmaassist:latest python -m pytest tests/test_api.py -v
