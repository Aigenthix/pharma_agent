<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaAssist AI - Pharma Product Intelligence</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💊 PharmaAssist AI</h1>
            <p class="subtitle">Pharma Product Intelligence Assistant</p>
        </header>

        <section class="stats">
            <div class="stat-box">
                <span class="stat-value" id="total-products">20</span>
                <span class="stat-label">📊 Products</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="low-stock">3</span>
                <span class="stat-label">⚠️ Low Stock</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="out-of-stock">1</span>
                <span class="stat-label">🚫 Out of Stock</span>
            </div>
        </section>

        <section class="search-section">
            <input
                type="text"
                id="search-input"
                placeholder="Search medicine..."
                class="search-box"
            >
            <div id="search-results" class="search-results"></div>
        </section>

        <section class="chat-section">
            <h2>Ask PharmaAssist</h2>
            <div class="chat-input-group">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Tell me about Pantop 40..."
                    class="chat-input"
                    autocomplete="off"
                >
                <button id="send-btn" class="send-btn">Ask AI</button>
            </div>
            <div id="chat-history" class="chat-history"></div>
        </section>

        <section class="inventory-section">
            <h2>Inventory</h2>
            <div class="inventory-controls">
                <button id="low-stock-btn" class="inventory-btn">View Low Stock</button>
                <button id="expiring-btn" class="inventory-btn">Expiring Soon</button>
            </div>
            <div id="inventory-list" class="inventory-list"></div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
